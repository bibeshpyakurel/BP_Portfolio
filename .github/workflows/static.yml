name: Verify and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate portfolio content
        run: node scripts/validate-portfolio.mjs data/portfolio.json
      - name: Build pages from data
        run: node scripts/build-site.mjs
      - name: Built pages must match the committed pages
        run: git diff --exit-code -- index.html research.html || (echo "::error::index.html or research.html is stale. Run node scripts/build-site.mjs and commit." && exit 1)
      - name: Lighthouse (mobile) against a local server
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          npx --yes lighthouse "http://localhost:8765/index.html" --quiet --chrome-flags="--headless=new --no-sandbox" --form-factor=mobile --output=json --output-path=./lh.json
          node scripts/check-lighthouse.mjs ./lh.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-mobile
          path: lh.json
          retention-days: 14

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build pages from data
        run: node scripts/build-site.mjs
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
