name: Verify and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate portfolio content
        run: node scripts/validate-portfolio.mjs data/portfolio.json
      - name: Build pages from data
        run: node scripts/build-site.mjs
      - name: Built pages must match the committed pages
        run: git diff --exit-code -- index.html research.html || (echo "::error::index.html or research.html is stale. Run node scripts/build-site.mjs and commit." && exit 1)
      - name: Lighthouse (mobile) against a local server
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          npx --yes lighthouse "http://localhost:8765/index.html" --quiet --chrome-flags="--headless=new --no-sandbox" --form-factor=mobile --output=json --output-path=./lh.json
          node scripts/check-lighthouse.mjs ./lh.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-mobile
          path: lh.json
          retention-days: 14

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pages from data
        run: node scripts/build-site.mjs
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
